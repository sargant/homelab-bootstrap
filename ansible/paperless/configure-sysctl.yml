---
- name: Install Paperless kernel settings
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/99-paperless.conf"
    dest: /etc/sysctl.d/99-paperless.conf
    owner: root
    group: root
    mode: "0644"
  register: paperless_sysctl_config

- name: Read memory overcommit setting
  ansible.builtin.command:
    argv:
      - sysctl
      - -n
      - vm.overcommit_memory
  register: paperless_overcommit_memory
  changed_when: false

- name: Apply Paperless kernel settings
  ansible.builtin.command:
    argv:
      - sysctl
      - -p
      - /etc/sysctl.d/99-paperless.conf
  when:
    - paperless_sysctl_config.changed or paperless_overcommit_memory.stdout | trim != '1'
  changed_when: true

- name: Verify memory overcommit setting
  ansible.builtin.command:
    argv:
      - sysctl
      - -n
      - vm.overcommit_memory
  register: paperless_overcommit_memory_check
  changed_when: false

- name: Check memory overcommit setting
  ansible.builtin.assert:
    that:
      - paperless_overcommit_memory_check.stdout | trim == '1'
    fail_msg: vm.overcommit_memory is not set to 1.
