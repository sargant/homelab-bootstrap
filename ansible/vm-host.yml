---
- name: Initialize Proxmox management host
  hosts: vm_host
  gather_facts: false

  vars:
    proxmox_storage_requirements:
      - storage: local
        content:
          - vztmpl
          - import
          - snippets
      - storage: local-lvm
        content:
          - rootdir
          - images

  tasks:
    - name: Bootstrap Debian host
      ansible.builtin.include_tasks: "{{ common_dir }}/bootstrap-debian.yml"

    - name: Check Proxmox VE
      ansible.builtin.command:
        argv:
          - pveversion
      changed_when: false

    - name: Check required Proxmox storage content types
      ansible.builtin.command:
        argv:
          - pvesm
          - status
          - --storage
          - "{{ item.0.storage }}"
          - --content
          - "{{ item.1 }}"
          - --enabled
          - "1"
          - --output-format
          - json
      loop: "{{ proxmox_storage_requirements | subelements('content') }}"
      loop_control:
        label: "{{ item.0.storage }} supports {{ item.1 }}"
      register: proxmox_storage_checks
      changed_when: false

    - name: Verify required Proxmox storage content types
      ansible.builtin.assert:
        that:
          - (item.stdout | from_json | length) > 0
        fail_msg: >-
          Proxmox storage {{ item.item.0.storage }} must be enabled and support
          content type {{ item.item.1 }}.
      loop: "{{ proxmox_storage_checks.results }}"
      loop_control:
        label: "{{ item.item.0.storage }} supports {{ item.item.1 }}"

    - name: Install management prerequisites
      ansible.builtin.apt:
        name:
          - ansible-core
          - just
          - openssh-client
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Install OpenTofu
      ansible.builtin.include_tasks: "{{ common_dir }}/install-opentofu.yml"

    - name: Check VM management private key
      ansible.builtin.stat:
        path: /root/.ssh/vm-management
      register: vm_management_private_key

    - name: Check VM management public key
      ansible.builtin.stat:
        path: /root/.ssh/vm-management.pub
      register: vm_management_public_key

    - name: Reject incomplete VM management keypair
      ansible.builtin.assert:
        that:
          - vm_management_private_key.stat.exists == vm_management_public_key.stat.exists
        fail_msg: >-
          Expected both /root/.ssh/vm-management and /root/.ssh/vm-management.pub,
          or neither. Refusing to repair an incomplete keypair.

    - name: Create VM management SSH keypair
      ansible.builtin.command:
        argv:
          - ssh-keygen
          - -q
          - -t
          - ed25519
          - -N
          - ""
          - -C
          - vm-management@vm-host
          - -f
          - /root/.ssh/vm-management
      when: not vm_management_private_key.stat.exists

    - name: Set VM management private key permissions
      ansible.builtin.file:
        path: /root/.ssh/vm-management
        mode: "0600"

    - name: Set VM management public key permissions
      ansible.builtin.file:
        path: /root/.ssh/vm-management.pub
        mode: "0644"

    - name: Authorize VM management key for local root SSH
      ansible.builtin.blockinfile:
        path: /root/.ssh/authorized_keys
        create: true
        owner: root
        group: root
        mode: "0600"
        marker: "# {mark} ANSIBLE MANAGED VM MANAGEMENT SSH KEY"
        block: "{{ lookup('ansible.builtin.file', '/root/.ssh/vm-management.pub') }}"

    - name: Verify Just
      ansible.builtin.command:
        argv:
          - just
          - --version
      changed_when: false

    - name: Verify VM management SSH key
      ansible.builtin.command:
        argv:
          - ssh-keygen
          - -l
          - -f
          - /root/.ssh/vm-management.pub
      changed_when: false
