---
- name: Bootstrap Python
  ansible.builtin.raw: |
    if [ ! -x /usr/bin/python3 ]; then
      apt-get update
      DEBIAN_FRONTEND=noninteractive apt-get install -y python3
      echo __ANSIBLE_CHANGED__
    fi
  register: python_bootstrap
  changed_when: "'__ANSIBLE_CHANGED__' in python_bootstrap.stdout"

- name: Gather facts
  ansible.builtin.setup:

- name: Check operating system
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution == "Debian"
      - ansible_facts.distribution_major_version == "13"
    fail_msg: >-
      Expected Debian 13, found
      {{ ansible_facts.distribution }} {{ ansible_facts.distribution_version }}.

- name: Check hostname
  ansible.builtin.assert:
    that:
      - ansible_facts["hostname"] == system_hostname
    fail_msg: >-
      Expected host {{ system_hostname }}, found {{ ansible_facts["hostname"] }}.
  when: system_hostname is defined

- name: Sync GitHub SSH keys
  ansible.builtin.import_tasks: sync-github-ssh-keys.yml

- name: Configure SSH authentication
  ansible.builtin.import_tasks: configure-ssh-auth.yml

- name: Configure shell
  ansible.builtin.import_tasks: configure-shell.yml
